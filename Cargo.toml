[package]
name = "ubidium-rs"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Rust gRPC bindings for the Race Result Ubidium timing decoder SDK (ubidium-sdk v0.9.12)"
license = "MIT"
repository = "https://github.com/skoky/ubidium-rs"
homepage = "https://github.com/skoky/ubidium-rs"
documentation = "https://docs.rs/ubidium-rs"
readme = "README.md"
keywords = ["ubidium", "raceresult", "grpc", "timing", "racetiming"]
categories = ["api-bindings", "network-programming"]
exclude = ["/.idea"]

[lib]
name = "ubidium"
path = "src/lib.rs"

[features]
default = ["cli"]
# Builds the `ubidium` command-line tool. Library-only users can opt out with
# `default-features = false`.
cli = ["dep:tokio", "dep:tokio-stream", "dep:anyhow", "dep:clap"]

[dependencies]
tonic = { version = "0.14.9", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14.9"
prost = "0.14.6"
prost-types = "0.14.6"

# Dependencies used only by the `ubidium` binary (feature `cli`).
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"], optional = true }
tokio-stream = { version = "0.1.19", optional = true }
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.9", features = ["derive", "env"], optional = true }

[build-dependencies]
tonic-prost-build = "0.14.9"

# Dependencies used only by the examples.
[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-stream = "0.1.19"
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }

[[bin]]
name = "ubidium"
path = "src/bin/ubidium/main.rs"
required-features = ["cli"]
# The library is also called `ubidium`; skip the binary's docs to avoid a
# rustdoc output-filename collision.
doc = false

[[example]]
name = "systeminfo"
path = "examples/systeminfo.rs"

[[example]]
name = "passings"
path = "examples/passings.rs"

[[example]]
name = "stored_passings"
path = "examples/stored_passings.rs"

[[example]]
name = "status"
path = "examples/status.rs"

[[example]]
name = "client"
path = "examples/client.rs"

[[example]]
name = "server"
path = "examples/server.rs"
